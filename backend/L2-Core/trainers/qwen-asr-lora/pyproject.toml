[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "airecord-qwen-asr-trainer"
version = "0.1.0"
description = "Isolated Hugging Face Qwen3-ASR LoRA training and evaluation runtime"
requires-python = ">=3.12,<3.15"
dependencies = [
  "accelerate>=1.12,<2",
  "datasets>=4,<5",
  "librosa>=0.11,<1",
  "peft>=0.17,<1",
  "soundfile>=0.13,<1",
  "torch>=2.8,<3",
  "transformers>=5.13,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
qwen-asr-lora = "airecord_qwen_asr_trainer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airecord_qwen_asr_trainer"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
