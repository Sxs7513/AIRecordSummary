[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-record-summary-backend"
version = "0.1.0"
description = "Python backend for AI Record Summary"
requires-python = ">=3.14.4,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/l1_foundation",
  "packages/l2_core",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = [
  "tests",
  "packages",
  "L3-App",
]
extraPaths = [
  "packages",
  "L3-App/shared-api/src",
  "L3-App/production-api/src",
  "L3-App/evaluation-api/src",
  "L3-App/training-api/src",
  "L3-App/production-worker/src",
  "L3-App/asr-compute-worker/src",
]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py314"
line-length = 160
src = ["packages", "L2-Core/trainers", "L3-App", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "access",
  "app_factory",
  "dependencies",
  "l1_foundation",
  "l2_core",
  "router",
  "routes",
  "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages",
  "L3-App/shared-api/src",
  "L3-App/production-api/src",
  "L3-App/evaluation-api/src",
  "L3-App/training-api/src",
  "L3-App/production-worker/src",
  "L3-App/asr-compute-worker/src",
]
addopts = "-q"
markers = ["integration: opt-in tests that require local audio models"]
