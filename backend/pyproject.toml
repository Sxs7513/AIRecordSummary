[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-record-summary-backend"
version = "0.1.0"
description = "Python backend for AI Record Summary"
requires-python = ">=3.14.4,<3.15"
dependencies = [
  "aiokafka>=0.12,<1",
  "cryptography>=45,<50",
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "rapidfuzz>=3.14,<4",
  "redis>=6,<8",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/l1_foundation",
  "packages/l2_core",
]

[tool.hatch.build]
exclude = [
  "/packages/l2_core/trainers",
  "/packages/l3_app",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = [
  "tests",
  "packages",
]
exclude = [
  "packages/l2_core/trainers",
]
extraPaths = [
  "packages",
  "packages/l3_app/production-api",
  "packages/l3_app/evaluation-api",
  "packages/l3_app/training-api",
  "packages/l3_app/observability-api",
  "packages/l3_app/observability_worker",
  "packages/l3_app/generation_worker",
  "packages/l3_app/processing_worker",
]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py314"
line-length = 160
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "access",
  "app_factory",
  "evaluation_dependencies",
  "l1_foundation",
  "l2_core",
  "l3_app",
  "production_dependencies",
  "training_dependencies",
  "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages",
  "packages/l3_app/production-api",
  "packages/l3_app/evaluation-api",
  "packages/l3_app/training-api",
  "packages/l3_app/observability-api",
]
addopts = "-q"
markers = ["integration: opt-in tests that require local audio models"]
