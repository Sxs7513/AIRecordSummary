[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-record-summary-backend"
version = "0.1.0"
description = "Python backend for AI Record Summary"
requires-python = ">=3.14.4,<3.15"
dependencies = [
  "datasets>=4,<5",
  "fastapi>=0.120,<1",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py314"
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: opt-in tests that require local audio models"]
